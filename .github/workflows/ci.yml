name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API(ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardrail
          POSTGRES_PASSWORD: guardrail
          POSTGRES_DB: guardrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardrail"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # 夹具会自己创建 guardrail_test 库,不会污染 guardrail 主库
      TEST_DATABASE_URL: postgresql+asyncpg://guardrail:guardrail@localhost:5432/guardrail_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest -m "not integration"
      - name: Integration tests
        run: uv run pytest -m integration

  web:
    name: Web(typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # 提交 package-lock.json 后可换成 npm ci
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
